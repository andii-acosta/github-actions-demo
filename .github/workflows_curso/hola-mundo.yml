name: lab1

on: 
  push:
    branches: [ "dev" ]

jobs: 
  inicio: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: definir varible user
        run: echo "USERNAME=${{github.actor}}" >> $GITHUB_ENV

      - name: script-runing
        run: python app/main.py

