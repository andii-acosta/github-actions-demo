name: "integration_main"
run-name: "Integracion test - CI"

on:
  push:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu_latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run tests
      run: pytest